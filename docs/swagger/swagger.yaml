basePath: /api/v1
definitions:
  main.DailyStats:
    properties:
      hourly_breakdown:
        items:
          additionalProperties: true
          type: object
        type: array
      summary:
        additionalProperties: true
        type: object
      timestamp:
        type: string
    type: object
  main.DashboardSummary:
    properties:
      current_status:
        additionalProperties: true
        description: Real-time status (epoch, queues)
        type: object
      participation_stats:
        additionalProperties: true
        description: 24h participation/inclusion metrics
        type: object
      recent_activity:
        additionalProperties: true
        description: 1m and 5m activity
        type: object
      system_metrics:
        additionalProperties: true
        description: Rates, totals, current counts (includes VPA metrics)
        type: object
      timestamp:
        type: string
      validator_id:
        type: string
      vpa_metrics:
        additionalProperties: true
        description: VPA-specific metrics (priority assignments, submissions)
        type: object
    type: object
  main.EnhancedTimelineEvent:
    properties:
      entity_id:
        type: string
      metadata:
        $ref: '#/definitions/main.TimelineEventMetadata'
      time:
        type: string
      timestamp:
        type: integer
    type: object
  main.EnhancedTimelineResponse:
    properties:
      count:
        type: integer
      events:
        items:
          $ref: '#/definitions/main.EnhancedTimelineEvent'
        type: array
      minutes:
        type: integer
      timestamp:
        type: string
      type:
        type: string
    type: object
  main.EpochInfo:
    properties:
      data_market:
        type: string
      duration:
        type: integer
      epoch_id:
        type: string
      level1_batch_exists:
        type: boolean
      level2_batch_exists:
        type: boolean
      phase:
        description: '"submission", "finalization", "aggregation", "complete"'
        type: string
      start_time:
        type: integer
      status:
        description: '"open", "closed"'
        type: string
    type: object
  main.FinalizedBatch:
    properties:
      epoch_id:
        type: string
      has_gap:
        description: Whether epoch has a gap
        type: boolean
      ipfs_cid:
        type: string
      level:
        description: 1 for local, 2 for aggregated
        type: integer
      merkle_root:
        type: string
      onchain_status:
        description: On-chain submission status
        type: string
      phase:
        description: Current phase of epoch
        type: string
      project_count:
        type: integer
      timestamp:
        type: integer
      type:
        description: '"local" or "aggregated"'
        type: string
      validator_count:
        description: Level 2 only
        type: integer
      validator_id:
        description: Level 1 only
        type: string
      validator_ids:
        description: Level 2 only
        items:
          type: string
        type: array
    type: object
  main.HeartbeatInfo:
    properties:
      entity_id:
        description: 'Format: hb:{peerID}:{timestamp}'
        type: string
      peer_id:
        description: libp2p peer ID of the sender
        type: string
      time:
        description: RFC3339 formatted time
        type: string
      timestamp:
        description: Unix timestamp when received
        type: integer
    type: object
  main.HeartbeatsResponse:
    properties:
      count:
        type: integer
      heartbeats:
        items:
          $ref: '#/definitions/main.HeartbeatInfo'
        type: array
      minutes:
        description: For recent query
        type: integer
      timestamp:
        type: string
    type: object
  main.HourlyStats:
    properties:
      hours:
        items:
          additionalProperties: true
          type: object
        type: array
      timestamp:
        type: string
    type: object
  main.QueueStatus:
    properties:
      depth:
        type: integer
      queue_name:
        type: string
      status:
        description: '"empty", "healthy", "moderate", "high", "critical"'
        type: string
    type: object
  main.SimulationInfo:
    properties:
      data_market:
        description: Data market address
        type: string
      entity_id:
        description: 'Format: sim:{slotID}:{projectID}:{timestamp}:{peerID}'
        type: string
      peer_id:
        description: libp2p peer ID of the sender
        type: string
      project_id:
        description: Project ID from the submission
        type: string
      slot_id:
        description: Slot ID from the submission
        type: string
      snapshot_cid:
        description: Real CID of the computed snapshot
        type: string
      snapshotter_address:
        description: EIP-712 recovered address from signature
        type: string
      time:
        description: RFC3339 formatted time
        type: string
      timestamp:
        description: Unix timestamp when received
        type: integer
    type: object
  main.SimulationsResponse:
    properties:
      count:
        type: integer
      minutes:
        description: For recent query
        type: integer
      simulations:
        items:
          $ref: '#/definitions/main.SimulationInfo'
        type: array
      timestamp:
        type: string
    type: object
  main.TimelineEventMetadata:
    properties:
      data_market:
        type: string
      epoch_id:
        type: string
      event_type:
        description: '"submission", "validation", "batch", "epoch"'
        type: string
      is_enhanced:
        description: Whether entity ID uses new enhanced format
        type: boolean
      peer_id:
        type: string
      project_id:
        type: string
      slot_id:
        type: string
      submission_type:
        description: '"snapshot", "validation"'
        type: string
      validator_id:
        type: string
    type: object
  main.VPAEpochStatusResponse:
    properties:
      epoch_id:
        type: string
      status:
        additionalProperties: true
        description: Combined priority and submission status
        type: object
      timestamp:
        type: string
    type: object
  main.VPAStatsResponse:
    properties:
      stats:
        additionalProperties: true
        description: Contains priority assignments, submissions, success rates, etc.
        type: object
      timestamp:
        type: string
    type: object
  main.VPATimelineResponse:
    properties:
      timeline:
        additionalProperties: true
        description: Contains "priority_timeline" and/or "submission_timeline"
        type: object
      timestamp:
        type: string
    type: object
info:
  contact: {}
  description: Monitoring API that reads pre-aggregated data from state-tracker worker
  title: DSV Pipeline Monitor API (Direct Redis)
  version: "3.0"
paths:
  /aggregation/results:
    get:
      description: Get network-wide aggregated batches with validator contributions
      parameters:
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      - description: Number of results (default 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.FinalizedBatch'
            type: array
      summary: Aggregation results
      tags:
      - aggregation
  /batches/finalized:
    get:
      description: Get Level 1 (local) or Level 2 (aggregated) finalized batches.
        Queries last 24 hours of data (matches retention period).
      parameters:
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      - description: Batch level (1 or 2, default both)
        in: query
        name: level
        type: integer
      - description: Specific epoch ID
        in: query
        name: epoch_id
        type: string
      - description: Number of batches to retrieve (default 50, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.FinalizedBatch'
            type: array
      summary: Finalized batches
      tags:
      - batches
  /dashboard/summary:
    get:
      description: Get pre-aggregated dashboard metrics from state-tracker
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.DashboardSummary'
      summary: Dashboard summary
      tags:
      - dashboard
  /epochs/{epochId}/status:
    get:
      description: Get complete epoch state with all phase information
      parameters:
      - description: Epoch ID
        in: path
        name: epochId
        required: true
        type: string
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Epoch status
      tags:
      - epochs
  /epochs/{epochId}/submissions:
    get:
      description: Get all submissions for a specific epoch with detailed metadata
        (slot ID, peer ID, project ID, CID)
      parameters:
      - description: Epoch ID
        in: path
        name: epochId
        required: true
        type: string
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Epoch submissions
      tags:
      - epochs
  /epochs/active:
    get:
      description: Get epochs currently in progress (window open, level 1/2 in progress).
        Queries epoch state directly for accuracy.
      parameters:
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.EpochInfo'
            type: array
      summary: Active epochs
      tags:
      - epochs
  /epochs/gaps:
    get:
      description: Identify epochs that should have finalizations but don't
      parameters:
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      - description: Window minutes to check for gaps (default 5)
        in: query
        name: window_minutes
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: Epoch gaps
      tags:
      - epochs
  /epochs/timeline:
    get:
      description: Get epoch progression with phases and batch status
      parameters:
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      - description: Number of epochs (default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.EpochInfo'
            type: array
      summary: Epochs timeline
      tags:
      - epochs
  /health:
    get:
      description: Check if the API and Redis connection are healthy
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - health
  /heartbeats/peer/{peerID}:
    get:
      description: Returns all heartbeat messages from the specified peer ID. Heartbeats
        are NOT EIP-712 signed.
      parameters:
      - description: libp2p Peer ID
        in: path
        name: peerID
        required: true
        type: string
      - default: 100
        description: Maximum number of heartbeats to return
        in: query
        name: limit
        type: integer
      - description: Protocol state contract address
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Heartbeats from the specified peer
          schema:
            $ref: '#/definitions/main.HeartbeatsResponse'
      summary: Get heartbeats from a specific peer
      tags:
      - Heartbeats
  /heartbeats/recent:
    get:
      description: Returns heartbeat messages received within the specified time window.
        Heartbeats are NOT EIP-712 signed - only peer ID is available.
      parameters:
      - default: 100
        description: Maximum number of heartbeats to return
        in: query
        name: limit
        type: integer
      - default: 60
        description: Time window in minutes
        in: query
        name: minutes
        type: integer
      - description: Protocol state contract address
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Recent heartbeat messages
          schema:
            $ref: '#/definitions/main.HeartbeatsResponse'
      summary: Get recent heartbeat messages
      tags:
      - Heartbeats
  /pipeline/overview:
    get:
      description: Get pipeline metrics from pre-aggregated data
      parameters:
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Pipeline overview (legacy support)
      tags:
      - pipeline
  /queues/status:
    get:
      description: Get real-time queue depths and processing rates
      parameters:
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.QueueStatus'
            type: array
      summary: Queue status
      tags:
      - queues
  /simulations/peer/{peerID}:
    get:
      description: Get all simulation messages from a specific peer (libp2p ID)
      parameters:
      - description: Peer ID (libp2p)
        in: path
        name: peerID
        required: true
        type: string
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Simulations from the specified peer
          schema:
            $ref: '#/definitions/main.SimulationsResponse'
      summary: Get simulations by peer ID
      tags:
      - simulations
  /simulations/recent:
    get:
      description: Get recent simulation messages (epoch 0 with real CIDs) from snapshotters.
        Simulations are sent at startup to verify connectivity and contain EIP-712
        signatures.
      parameters:
      - description: 'Maximum number of simulations to return (default: 50, max: 500)'
        in: query
        name: limit
        type: integer
      - description: 'Time window in minutes (default: 60)'
        in: query
        name: minutes
        type: integer
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of recent simulation messages
          schema:
            $ref: '#/definitions/main.SimulationsResponse'
      summary: List recent simulation messages
      tags:
      - simulations
  /simulations/slot/{slotID}:
    get:
      description: Get simulation messages for a specific slot ID
      parameters:
      - description: Slot ID
        in: path
        name: slotID
        required: true
        type: string
      - default: 10
        description: Maximum number of simulations to return
        in: query
        name: limit
        type: integer
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Simulations from the specified slot ID
          schema:
            $ref: '#/definitions/main.SimulationsResponse'
      summary: Get simulations by slot ID
      tags:
      - simulations
  /simulations/snapshotter/{address}:
    get:
      description: Get all simulation messages from a specific snapshotter (EIP-712
        recovered address)
      parameters:
      - description: Snapshotter address (Ethereum address)
        in: path
        name: address
        required: true
        type: string
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Simulations from the specified snapshotter
          schema:
            $ref: '#/definitions/main.SimulationsResponse'
      summary: Get simulations by snapshotter address
      tags:
      - simulations
  /spam/epochs:
    get:
      description: Get list of epochs that have spam tracking data. Queries epochs
        from aggregation windows (persistent) and active epoch peer sets (ephemeral,
        for recent epochs not yet aggregated). Epoch peer sets are deleted after window
        aggregation, so this endpoint primarily returns epochs from windows.
      parameters:
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      - description: 'Maximum number of epochs to return (default: 100, max: 1000)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of epochs with tracking data, each containing epoch_id
            and peer_count
          schema:
            additionalProperties: true
            type: object
      summary: List epochs with tracking data
      tags:
      - spam
  /spam/flagged/peers:
    get:
      description: Get list of all flagged peer IDs (from Redis cache, synced from
        on-chain)
      parameters:
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of flagged peers with metadata
          schema:
            additionalProperties: true
            type: object
      summary: Get flagged peers
      tags:
      - spam
  /spam/flagged/snapshotters:
    get:
      description: Get list of all flagged snapshotter addresses (from Redis cache,
        synced from on-chain)
      parameters:
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of flagged snapshotters with metadata
          schema:
            additionalProperties: true
            type: object
      summary: Get flagged snapshotters
      tags:
      - spam
  /spam/peer/{peerID}:
    get:
      description: Get validation failures, submission counts, and aggregation info
        for a specific peer
      parameters:
      - description: Peer ID (libp2p)
        in: path
        name: peerID
        required: true
        type: string
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      - description: Specific epoch ID (optional, defaults to current epoch)
        in: query
        name: epochID
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Spam tracking information for peer
          schema:
            additionalProperties: true
            type: object
      summary: Get spam tracking info for a peer
      tags:
      - spam
  /spam/peer/{peerID}/epochs:
    get:
      description: Get tracking data (submissions, validation failures) for a peer
        across multiple epochs
      parameters:
      - description: Peer ID (libp2p)
        in: path
        name: peerID
        required: true
        type: string
      - description: 'Start epoch (default: current epoch - 10)'
        in: query
        name: startEpoch
        type: integer
      - description: 'End epoch (default: current epoch)'
        in: query
        name: endEpoch
        type: integer
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Epoch-by-epoch tracking data
          schema:
            additionalProperties: true
            type: object
      summary: Get epoch-by-epoch tracking for a peer
      tags:
      - spam
  /spam/stats:
    get:
      description: Get aggregated spam protection statistics including flagged counts,
        reports, and enforcement metrics
      parameters:
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Spam protection statistics
          schema:
            additionalProperties: true
            type: object
      summary: Get spam protection statistics
      tags:
      - spam
  /spam/windows:
    get:
      description: Get list of all windows that have spam reports (for discovery/indexing).
        Windows are created at epoch boundaries (epochID % 10 == 0) and contain aggregated
        reports for a 10-epoch range. Windows persist for 2 hours (TTL).
      parameters:
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of windows with window_id, epoch_range (e.g., '24189511-24189520'),
            first_epoch, last_epoch, and peer_count
          schema:
            additionalProperties: true
            type: object
      summary: List all aggregation windows with reports
      tags:
      - spam
  /spam/windows/{windowID}:
    get:
      description: Get all peers and their aggregated reports for a specific window.
        Window ID is the end epoch of the 10-epoch range (e.g., window 24189520 contains
        epochs 24189511-24189520). Includes validator counts (consensus requires >=
        2 validators), all spam reports with epoch_id, violation_type, count, and
        evidence.
      parameters:
      - description: Window ID (end epoch of 10-epoch range, e.g., 24189520 for epochs
          24189511-24189520)
        in: path
        name: windowID
        required: true
        type: integer
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Window details including window_id, epoch_range, peers array
            with peer_id, validator_count, report_count, first_epoch, last_epoch,
            and reports array
          schema:
            additionalProperties: true
            type: object
      summary: Get details for a specific aggregation window
      tags:
      - spam
  /stats/daily:
    get:
      description: Get pre-aggregated 24-hour statistics
      parameters:
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.DailyStats'
      summary: Daily statistics
      tags:
      - stats
  /stats/hourly:
    get:
      description: Get pre-aggregated hourly statistics
      parameters:
      - description: Protocol state identifier
        in: query
        name: protocol
        type: string
      - description: Data market address
        in: query
        name: market
        type: string
      - description: Number of hours to retrieve (default 24)
        in: query
        name: hours
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HourlyStats'
      summary: Hourly statistics
      tags:
      - stats
  /timeline/recent:
    get:
      description: Get recent events from timeline sorted sets with enriched metadata
      parameters:
      - description: Event type (submission, validation, epoch, batch)
        in: query
        name: type
        type: string
      - description: Minutes to look back (default 5, max 1440 for 24 hours)
        in: query
        name: minutes
        type: integer
      - description: Include detailed metadata from Redis (default true)
        in: query
        name: include_metadata
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.EnhancedTimelineResponse'
      summary: Recent timeline
      tags:
      - timeline
  /vpa/epoch/{epochID}:
    get:
      description: Get priority assignment and submission status for a specific epoch.
        Returns combined priority and submission information including priority details
        and submission details if available.
      parameters:
      - description: Epoch ID
        in: path
        name: epochID
        required: true
        type: string
